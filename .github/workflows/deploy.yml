name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it; queued runs collapse to the latest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The Node that runs the build. Separate from the Node that runs the actions
          # themselves — the runner's "Node 20 is deprecated" notice refers to the latter,
          # and is resolved by the action versions pinned in this file, not by this value.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # Builds with base /geostripe/ (from .env.pages) for a Pages *project* site.
        #
        # When a custom domain is added, the site is served from the root instead, and
        # this must become `npm run build:domain` or every asset 404s. See DEPLOYMENT.md.
        run: npm run build:pages

      # Requires Settings -> Pages -> Source: "GitHub Actions".
      #
      # If the source is still "Deploy from a branch", this step fails with
      # "Get Pages site failed ... Not Found". The action's `enablement: true` input can
      # create the site automatically, but it explicitly requires a PAT with repo/Pages
      # write scope — it does NOT work with the default GITHUB_TOKEN — so flipping the
      # setting once by hand is the simpler and more predictable fix.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
