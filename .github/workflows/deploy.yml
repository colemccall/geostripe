name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it; queued runs collapse to the latest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # Builds with base /geostripe/ (from .env.pages) for a Pages *project* site.
        #
        # When a custom domain is added, the site is served from the root instead, and
        # this must become `npm run build:domain` or every asset 404s. See DEPLOYMENT.md.
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
